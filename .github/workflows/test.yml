name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every run signs in as the same seed accounts on the one test project, so two
# runs at once (a PR run and the main run after its merge) trip the test
# project's sign-in rate limit. One run at a time; the next waits its turn
# (GitHub keeps only the newest waiting run and cancels older waiting ones).
concurrency:
  group: test-supabase
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Errors fail the build; warnings don't.
      - run: npm run lint

      # Every secret below belongs to the TEST Supabase project ("action-test"),
      # never production: same names, test-project values (see
      # .env.test.local.example for which key each one takes).
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Layer 1 (RLS/integration) only. These act solely as seed accounts against
      # the TEST Supabase project, so the vars below must be set as repo secrets
      # holding the test project's values. No service-role key here — the tests
      # never need one.
      - run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          # Optional: without it the admin tests (and the INSERT guard test) skip.
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

      # NOTE: the Playwright E2E suite (npm run test:e2e) is intentionally NOT run
      # in CI. It needs a live Next server, seeded data, and browser binaries —
      # run it locally. Wire it up here later once there's a disposable DB.
